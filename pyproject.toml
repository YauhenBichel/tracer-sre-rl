[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    # Style & correctness
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "W",     # pycodestyle warnings
    "I",     # isort (import ordering)
    "N",     # pep8-naming (consistent naming conventions)
    "UP",    # pyupgrade (modern Python idioms)
    "RUF",   # ruff-specific rules
    # SOLID / OOP / best practices
    "B",     # flake8-bugbear (design pitfalls, mutable defaults — LSP/OCP)
    "SIM",   # flake8-simplify (DRY: simplifiable/duplicate logic patterns)
    "PIE",   # flake8-pie (unnecessary code — DRY)
    "RET",   # flake8-return (SRP: clean return flow)
    "ARG",   # flake8-unused-arguments (ISP: don't depend on unused params)
    "PL",    # pylint (complexity/SRP, design, convention, errors)
    "C90",   # mccabe complexity (SRP: functions should do one thing)
    "SLF",   # flake8-self (OOP: don't access private members externally)
    "FBT",   # flake8-boolean-trap (clean interfaces — ISP)
    "A",     # flake8-builtins (don't shadow builtins — best practice)
    "ERA",   # eradicate (no commented-out code — DRY/clean code)
    "RSE",   # flake8-raise (proper exception patterns — OOP)
    "FLY",   # flynt (consistent f-string usage — DRY)
    "FURB",  # refurb (modern idiomatic patterns — best practice)
    "DTZ",   # flake8-datetimez (timezone-aware datetime — best practice)
    "T20",   # flake8-print (use logging, not print — SRP/best practice)
    "PT",    # flake8-pytest-style (consistent test patterns)
    # Security & performance
    "S",     # flake8-bandit (security)
    "PERF",  # perflint (performance)
    "C4",    # flake8-comprehensions (performance)
]
ignore = [
    "E501",    # line too long (handled by formatter)
    "S101",    # assert used (needed in tests)
    "S311",    # pseudo-random generators (fine for RL training)
    "PLR2004", # magic value in comparison (too noisy for numeric RL code)
    "PLR0913", # too many arguments (dataclass constructors naturally have many)
    "ARG002",  # unused method argument (common in interface/base class overrides)
    "RET504",  # unnecessary assignment before return (sometimes aids readability)
    "SIM108",  # ternary instead of if-else (readability preference)
    "FBT001",  # boolean positional arg in function definition (too strict for simple helpers)
    "FBT002",  # boolean default in function definition (common in config)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "ARG", "PLR0915", "PLR0911", "PLC0415", "SLF001", "T20"]
"app/cli/**/*.py" = ["T20"]  # CLI scripts use print for user output
"app/main.py" = ["T20", "PLC0415", "RUF005"]  # entry point: print, conditional imports, list concat
"app/integration/opensre_runner.py" = ["ARG001", "PLC0415", "T20", "SLF001", "PLR0915"]
"app/integration/**/*.py" = ["ARG001"]  # adapter stubs may have unused args
"app/training/episode_runner.py" = ["PLC0415", "T20"]  # conditional imports, progress prints
"app/training/metrics.py" = ["T20"]  # metrics display functions use print

[tool.ruff.lint.pylint]
max-branches = 12
max-returns = 8
max-statements = 60

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pylint.main]
disable = "all"
enable = "R0801"  # duplicate-code (DRY enforcement)
min-similarity-lines = 6
ignore-paths = ["tests"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B311"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
