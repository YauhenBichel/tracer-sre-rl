# GCP incident crawler configuration.
# Fetches from Google Cloud's public incident JSON feed.
gcp:
  url: "https://status.cloud.google.com/incidents.json"        # public JSON API, no auth required
  base_incident_url: "https://status.cloud.google.com/incidents/"  # prefix for individual incident URLs
  # Fields checked to compute a quality score (0-1) for each incident.
  # Pipe syntax means OR: "updates|most-recent-update" counts if either field is present.
  quality_fields:
    - "external_desc"                   # human-readable incident description
    - "updates|most-recent-update"      # timeline updates (GCP uses different field names across API versions)
    - "service_name"                    # affected GCP service (e.g., "Google Compute Engine")
    - "severity"                        # incident severity level
    - "status_impact"                   # impact classification (e.g., "SERVICE_DISRUPTION")

# Cloudflare incident crawler configuration.
# Uses the Atlassian Statuspage API (same format used by GitHub, Datadog, etc.).
cloudflare:
  url: "https://yh6f0r4529hb.statuspage.io/api/v2/incidents.json"  # Cloudflare's Statuspage API
  max_pages: 5                          # maximum number of pages to fetch (20 incidents per page)
  quality_fields:
    - "name"                            # incident title
    - "incident_updates"                # timeline of status updates
    - "components"                      # affected Cloudflare components (e.g., "API", "Dashboard")
    - "resolved_at"                     # resolution timestamp (present = incident is closed)

# GitHub post-mortem crawler configuration.
# Parses the curated danluu/post-mortems README for links to real incident reports.
github_postmortems:
  url: "https://raw.githubusercontent.com/danluu/post-mortems/master/README.md"  # raw markdown
  # URLs containing these substrings are skipped (repo links, not incident reports).
  skip_urls:
    - "github.com/danluu"              # links to the repo itself
    - "wikipedia.org/wiki/List"        # Wikipedia list pages, not individual incidents
  # Regex patterns for auto-classifying incidents by description text.
  # Keys are taxonomy labels; values are case-insensitive regex patterns.
  category_patterns:
    # Infrastructure
    "infrastructure.compute.instance_failure": "(?i)hardware|power|UPS|server.*(down|fail|crash)"
    "infrastructure.compute.cpu_saturation": "(?i)\\bCPU\\b|cpu.*(spike|saturat|100%)|high.?load"
    "infrastructure.compute.oom": "(?i)\\bOOM\\b|out.?of.?memory|killed.?by.?kernel"
    "infrastructure.compute.container_crash": "(?i)container|pod|CrashLoop|restart.?loop|k8s"
    "infrastructure.network.dns": "(?i)\\bDNS\\b|name.?resolution|nslookup"
    "infrastructure.network.partition": "(?i)network.*(partition|split|unreachable)|connectivity"
    "infrastructure.network.tls_certificate": "(?i)certific|TLS|SSL|expir.*cert"
    "infrastructure.network.load_balancer": "(?i)load.?balanc|\\bELB\\b|\\bALB\\b|nginx.*(down|fail)"
    "infrastructure.database.split_brain": "(?i)split.?brain|database.*(fail|corrupt|outage)|postgres|mysql|mongo"
    "infrastructure.database.connection_pool": "(?i)connection.?pool|max.?connections|too.?many.?connections"
    "infrastructure.database.replication_lag": "(?i)replication|replica.*(lag|behind|fail)"
    "infrastructure.storage.disk_full": "(?i)disk.*(full|space)|storage.*(full|exhaust)|\\binode\\b"
    "infrastructure.storage.iops_throttling": "(?i)\\bIOPS\\b|disk.*(throttl|I/O)|EBS.*(burst|throttl)"
    # Application
    "application.memory.leak": "(?i)memory.?leak|leak|\\bOOM\\b|heap"
    "application.dependency.cascading_failure": "(?i)cascad|cascade|retry.?storm|circuit.?breaker|thundering.?herd"
    "application.dependency.upstream_timeout": "(?i)timeout|upstream.*(slow|fail)|dependency.*(fail|slow)"
    "application.concurrency.deadlock": "(?i)deadlock|race.?condition|lock.?contention"
    # Operational
    "operational.deployment.bad_deploy": "(?i)deploy|release|rollout|rollback|canary"
    "operational.deployment.feature_flag": "(?i)feature.?flag|toggle|experiment"
    "operational.configuration.resource_limits": "(?i)config|misconfigur|limit|quota"
    "operational.capacity.traffic_spike": "(?i)traffic|spike|capacity|scale|\\bDDoS\\b|viral"
    "operational.capacity.queue_backlog": "(?i)queue|backlog|consumer.?lag|kafka|rabbit"
    # External
    "external.cloud_provider": "(?i)\\bAWS\\b|\\bGCP\\b|Azure|cloud.*(outage|incident)|\\bS3\\b|\\bEC2\\b"
    "external.cdn": "(?i)\\bCDN\\b|Cloudflare|Akamai|Fastly|edge.*(fail|outage)"
