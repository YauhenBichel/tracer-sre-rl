services:
  check-reward:
    build: .
    container_name: sre-check-reward
    command: python -m app.main check-reward --quiet

  test:
    build: .
    container_name: sre-tests
    command: python -m pytest tests/ -v

  train:
    build: .
    container_name: sre-training
    volumes:
      - ./config:/project/config
      - ./data:/project/data
      - ./training_data:/project/training_data
    command: python -m app.main train

  export:
    build: .
    container_name: sre-export
    volumes:
      - ./config:/project/config
      - ./data:/project/data
      - ./training_data:/project/training_data
    command: python -m app.main export

  crawl:
    build: .
    container_name: sre-crawler
    volumes:
      - ./data:/project/data
    command: python -m app.main crawl --db-path /project/data/incidents.db
