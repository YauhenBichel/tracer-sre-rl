services:
  demo:
    build: .
    container_name: sre-demo
    command: python demo.py --quiet

  test:
    build: .
    container_name: sre-tests
    command: python -m pytest tests/ -v

  train:
    build: .
    container_name: sre-training
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./training_data:/app/training_data
    command: python run_training.py

  train-export:
    build: .
    container_name: sre-export
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./training_data:/app/training_data
    command: python run_training.py --export training_data/trajectories.jsonl

  crawl:
    build: .
    container_name: sre-crawler
    volumes:
      - ./data:/app/data
    command: python run_crawler.py --db-path /app/data/incidents.db
